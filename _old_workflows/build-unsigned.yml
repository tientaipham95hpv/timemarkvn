name: Build TimeMark VN V5 Unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Generate Xcode project
        run: ./generate_project.sh

      - name: Resolve package dependencies
        run: |
          xcodebuild \
            -project TimeMarkVN.xcodeproj \
            -scheme TimeMarkVN \
            -sdk iphoneos \
            -configuration Release \
            -showBuildSettings >/dev/null

      - name: Build unsigned app
        run: |
          rm -rf build
          xcodebuild \
            -project TimeMarkVN.xcodeproj \
            -scheme TimeMarkVN \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/TimeMarkVN.app"
          test -d "$APP_PATH"
          rm -rf Payload TimeMarkVN-V5-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/TimeMarkVN.app
          /usr/bin/zip -qry TimeMarkVN-V5-unsigned.ipa Payload
          ls -lh TimeMarkVN-V5-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: TimeMarkVN-V5-unsigned-IPA
          path: TimeMarkVN-V5-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
