name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select compatible Xcode
        run: |
          set -euo pipefail
          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true

          XCODE_APP=$(find /Applications -maxdepth 1 -type d -name 'Xcode_16*.app' | sort -V | tail -1)

          if [ -z "$XCODE_APP" ]; then
            echo "ERROR: No Xcode 16.x installation was found on this runner."
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi

          echo "Using: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcode-select -p
          xcodebuild -version

      - name: Generate project
        run: bash ./generate_project.sh

      - name: Verify generated Xcode project
        run: |
          set -euo pipefail
          test -f GeoStamp.xcodeproj/project.pbxproj
          grep -E 'objectVersion|compatibilityVersion' GeoStamp.xcodeproj/project.pbxproj | head -5 || true

      - name: Build unsigned app
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build

          xcodebuild \
            -project GeoStamp.xcodeproj \
            -scheme GeoStamp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          APP_PATH=$(find "$PWD/build/DerivedData/Build/Products/Release-iphoneos" \
            -maxdepth 1 -type d -name "GeoStamp.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "Không tìm thấy GeoStamp.app"
            find "$PWD/build/DerivedData/Build/Products" -maxdepth 3 -print
            exit 1
          fi

          rm -rf build/Payload build/GeoStamp.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/GeoStamp.app

          echo "Inspecting Info.plist structure:"
          plutil -p build/Payload/GeoStamp.app/Info.plist

          # Strip Xcode's ad-hoc _CodeSignature to prevent conflicts when signing with ESign/Scarlet/GBox
          rm -rf build/Payload/GeoStamp.app/_CodeSignature

          # IPA is simply a ZIP containing Payload/<App>.app.
          cd build
          /usr/bin/zip -qry GeoStamp.ipa Payload

          echo "Created unsigned IPA:"
          ls -lh GeoStamp.ipa
          echo "IPA contents:"
          unzip -l GeoStamp.ipa | head -40

      - name: Verify IPA structure
        run: |
          set -euo pipefail
          test -f build/GeoStamp.ipa
          unzip -l build/GeoStamp.ipa | grep -q "Payload/GeoStamp.app/"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: GeoStamp-Unsigned-IPA
          path: build/GeoStamp.ipa
          if-no-files-found: error
